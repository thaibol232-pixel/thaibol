<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Risk Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --card:#12151B;
    --card2:#161A21;
    --border:#1E232B;
    --text:#E8EAED;
    --muted:#7C8797;
    --gold:#F5A623;
    --blue:#3E8EF7;
    --green:#3ECF8E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    -webkit-font-smoothing:antialiased;
    padding:20px 14px 100px;
    line-height:1.75;
    letter-spacing:.035em;
  }
  hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
  h1,h2,.disp{font-family:'Space Grotesk', sans-serif;}
  .eyebrow{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:600;
    margin-bottom:6px;
  }
  header{margin-bottom:18px;}
  header h1{font-size:20px;font-weight:700;margin:0 0 14px;color:var(--text);letter-spacing:.01em;}
  .ticker{
    background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
  }
  .ticker .block{flex:1;min-width:0;}
  .ticker .label{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-family:'Space Grotesk',sans-serif;}
  .ticker .val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em;}
  .ticker .val.gold{color:var(--gold);}
  .ticker .divider{width:1px;background:var(--border);align-self:stretch;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 16px;
    margin-top:14px;
  }
  .card h2{font-size:13px;font-weight:600;color:var(--blue);margin:0 0 14px;letter-spacing:.06em;}
  .row{display:flex;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .row:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
  .field{flex:1;min-width:0;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-family:'Space Grotesk',sans-serif;letter-spacing:.03em;}
  input{
    width:100%;background:var(--card2);border:1px solid var(--border);
    color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:15px;
    padding:10px 11px;border-radius:8px;outline:none;letter-spacing:.03em;
  }
  input:focus{border-color:var(--blue);}

  .asset{
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
    background:var(--card2);
  }
  .asset-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .asset-top input{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:var(--gold);background:transparent;border:none;padding:0;width:auto;flex:1;}
  .del{
    background:none;border:none;color:var(--muted);font-size:18px;line-height:1;
    padding:2px 6px;cursor:pointer;
  }
  .del:active{color:#E05C5C;}

  .addbtn,.calcbtn{
    width:100%;border:none;border-radius:10px;padding:12px;
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
    cursor:pointer;
  }
  .addbtn{
    background:transparent;border:1px dashed var(--border);color:var(--muted);margin-top:2px;
  }
  .addbtn:active{border-color:var(--blue);color:var(--blue);}
  .calcbtn{
    background:var(--gold);color:#1A1300;margin-top:16px;
    font-size:15px;padding:14px;
  }
  .calcbtn:active{background:#D6910F;}

  .result-card h2{color:var(--gold);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;border-spacing:0 0;}
  th{
    text-align:center;color:var(--muted);font-weight:500;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.08em;padding:0 8px 10px 0;
    font-family:'Space Grotesk',sans-serif;white-space:nowrap;
  }
  th:first-child,td:first-child{text-align:left;padding-left:0;}
  td{padding:11px 8px 11px 0;border-top:1px solid var(--border);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.03em;vertical-align:middle;}
  td.lbl{color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.02em;}
  td.tp{color:var(--green);font-weight:600;}
  .scrollx{overflow-x:auto;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}

.progress-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 4px;border-bottom:1px solid var(--border);gap:10px;
  text-align:center;
}
.progress-row:last-child{border-bottom:none;padding-bottom:0;}
.progress-row .plabel{font-family:'Space Grotesk',sans-serif;font-size:12.5px;color:var(--text);letter-spacing:.02em;}
.progress-row .pnum{font-size:18px;font-weight:600;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap;}
.progress-row .pnum.done{color:var(--gold);font-size:14px;}
.phint{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.7;}
  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:24px;line-height:1.7;letter-spacing:.02em;padding:0 6px;}
</style>
</head>
<body>

<header>
  <h1>Risk & Fee Calculator</h1>
  <div class="ticker">
    <div class="block">
      <div class="label">Vốn hiện tại</div>
      <div class="val" id="tCapital">1100</div>
    </div>
    <div class="divider"></div>
    <div class="block">
      <div class="label">Mục tiêu</div>
      <div class="val" id="tTarget">8000</div>
    </div>
    <div class="divider"></div>
    <div class="block">
      <div class="label">Còn thiếu</div>
      <div class="val gold" id="tRemain">6900</div>
    </div>
  </div>
</header>

<div class="card">
  <h2>Tài khoản & mức risk</h2>
  <div class="row">
    <div class="field">
      <label>Vốn hiện tại (USDT)</label>
      <input type="number" id="capital" value="1100" inputmode="decimal">
    </div>
    <div class="field">
      <label>Mục tiêu (USDT)</label>
      <input type="number" id="target" value="8000" inputmode="decimal">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Risk mỗi lệnh full (%)</label>
      <input type="number" id="riskPct" value="5" inputmode="decimal">
    </div>
  </div>
</div>

<div class="card" id="progressCard">
  <h2>Hành trình mục tiêu — số lệnh còn lại</h2>
  <div id="progressList"></div>
</div>

<div class="card" id="assetsCard">
  <h2>Tài sản (chia lệnh)</h2>
  <div id="assetsList"></div>
  <button class="addbtn" onclick="addAsset()">+ Thêm tài sản</button>
</div>

<button class="calcbtn" onclick="calculate()">Tính kết quả</button>

<div id="results"></div>

<footer>Nhập số liệu → bấm Tính kết quả. Công thức: KL trước phí = Risk USD ÷ hệ số; Phí = KL trước phí × hệ số phí; TP = KL trước phí + Phí.</footer>

<script>
let assets = [
  {name:"BTC", divisor:250, fee:45},
  {name:"ETH", divisor:10, fee:1.5},
  {name:"XAU", divisor:10, fee:0.4},
];

function renderAssets(){
  const list = document.getElementById('assetsList');
  list.innerHTML = '';
  assets.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'asset';
    div.innerHTML = `
      <div class="asset-top">
        <input value="${a.name}" oninput="assets[${i}].name=this.value">
        <button class="del" onclick="removeAsset(${i})">✕</button>
      </div>
      <div class="row" style="margin-bottom:0;">
        <div class="field">
          <label>Hệ số chia (giá/đòn bẩy)</label>
          <input type="number" value="${a.divisor}" inputmode="decimal" oninput="assets[${i}].divisor=parseFloat(this.value)||0">
        </div>
        <div class="field">
          <label>Hệ số phí</label>
          <input type="number" value="${a.fee}" inputmode="decimal" oninput="assets[${i}].fee=parseFloat(this.value)||0">
        </div>
      </div>
    `;
    list.appendChild(div);
  });
}

function addAsset(){
  assets.push({name:"Mới", divisor:1, fee:0});
  renderAssets();
}
function removeAsset(i){
  assets.splice(i,1);
  renderAssets();
}

function renderProgress(capital, target, levels){
  const box = document.getElementById('progressList');
  box.innerHTML = '';

  if(capital<=0 || target<=0){
    box.innerHTML = '<div class="empty">Nhập vốn và mục tiêu để xem tiến độ.</div>';
    return;
  }
  if(capital>=target){
    box.innerHTML = '<div class="progress-row"><span class="plabel">🎉 Đã đạt mục tiêu</span><span class="pnum done">0 lệnh</span></div>';
    return;
  }

  levels.forEach(lv=>{
    const r = lv.pct/100;
    let n = '-';
    if(r>0){
      n = Math.ceil(Math.log(target/capital)/Math.log(1+r));
    }
    box.innerHTML += `<div class="progress-row">
      <span class="plabel">${lv.label}</span>
      <span class="pnum">${n} lệnh</span>
    </div>`;
  });

  box.innerHTML += `<div class="phint">* Số lệnh thắng liên tiếp cần thiết (RR 1:1, không tính lệnh thua) để đi từ vốn hiện tại đến mục tiêu — đây là mốc lý tưởng để theo dõi, không phải dự đoán chắc chắn.</div>`;
}

function fmt(n){
  if(!isFinite(n)) return '-';
  return n.toLocaleString('en-US', {maximumFractionDigits:4});
}

function calculate(){
  const capital = parseFloat(document.getElementById('capital').value)||0;
  const target = parseFloat(document.getElementById('target').value)||0;
  const riskPct = parseFloat(document.getElementById('riskPct').value)||0;

  document.getElementById('tCapital').textContent = fmt(capital);
  document.getElementById('tTarget').textContent = fmt(target);
  document.getElementById('tRemain').textContent = fmt(target-capital);

  const levels = [
    {label:`Full lệnh (${riskPct}%)`, pct: riskPct},
    {label:`2 lệnh (${(riskPct/2).toFixed(2)}% mỗi lệnh)`, pct: riskPct/2},
    {label:`4 lệnh (${(riskPct/4).toFixed(2)}% mỗi lệnh)`, pct: riskPct/4},
  ];

  renderProgress(capital, target, levels);

  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';

  if(assets.length===0){
    resultsDiv.innerHTML = '<div class="card"><div class="empty">Chưa có tài sản nào để tính.</div></div>';
    return;
  }

  assets.forEach(a => {
    const card = document.createElement('div');
    card.className = 'card result-card';
    let rows = '';
    levels.forEach(lv => {
      const riskUSD = capital * lv.pct/100;
      const qty = a.divisor ? riskUSD / a.divisor : 0;
      const fee = qty * a.fee;
      const tp = riskUSD + fee;
      rows += `<tr>
        <td class="lbl">${lv.label}</td>
        <td>${fmt(riskUSD)}</td>
        <td>${fmt(qty)}</td>
        <td>${fmt(fee)}</td>
        <td class="tp">${fmt(tp)}</td>
      </tr>`;
    });
    card.innerHTML = `
      <h2>${a.name || 'Tài sản'}</h2>
      <div class="scrollx">
      <table>
        <thead><tr>
          <th>Loại lệnh</th><th>Risk (USD)</th><th>KL trước phí</th><th>Phí</th><th>TP (KL+phí)</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    `;
    resultsDiv.appendChild(card);
  });
}

renderAssets();
calculate();
</script>
</body>
</html>
